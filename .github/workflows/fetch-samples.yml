name: Fetch site samples
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download pages
        run: |
          mkdir s && cd s
          B="https://www.rasasoccer.ca/leagues"
          UA="Mozilla/5.0 (RASA app data sync)"
          get(){ curl -sSL -A "$UA" -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2"; sleep 1; }
          get sched_default.html "$B/schedules.cfm?leagueid=27680&clientid=6369"
          get sched_all.html "$B/schedules.cfm?leagueid=27680&clientid=6369&monthID=0"
          get sched_nov.html "$B/schedules.cfm?leagueid=27680&clientid=6369&monthID=11,2026"
          get sched_dec.html "$B/schedules.cfm?leagueid=27680&clientid=6369&monthID=12,2026"
          get officials.html "$B/schedules.cfm?clientid=6369&leagueID=27680&schedType=officials&gameType="
          get officials_dec.html "$B/schedules.cfm?clientid=6369&leagueID=27680&schedType=officials&gameType=&monthID=12,2026"
          get standings.html "$B/standings.cfm?leagueid=27680&clientid=6369"
          get team.html "$B/stats_1team.cfm?clientid=6369&leagueID=27680&teamID=684068"
          get cards.html "$B/rostersV2.cfm?clientid=6369&leagueID=27680&teamID=684068&rosterDisplay=cards"
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: s
